// 字段命名规则：
//   - 有明确语义的字段使用语义名
//   - 语义不明但出现频率高的用 fXXXXX 命名
//   - 置信度标注：✅ 高 / 🔍 中 / ❓ 低
//
// 外层消息（顶层，直接对应 c2c_msg_table."40800" 列）
//
// 40011（c2c_msg_table 列）与内层 content_type（45002）的对应关系：
//   40011=2  标准消息（文本 / 图片 / 文件混合，由 45002 细分）
//   40011=3  文件附件
//   40011=5  名片分享 / 引用回复（40011=5 特有 477xx/482xx 字段）
//   40011=6  名片（459xx 字段）
//   40011=7  带位置 tag 的短视频（45851-45863；本数据集不含地图 pin，经纬度字段全为 0）
