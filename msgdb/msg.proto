//   40011=11 合并转发（479xx 字段）
//   40011=17 系统通知（80810-80995）
//   40011=19 通话通知（481xx 字段）

syntax = "proto3";
package qq;

// ============================================================
// 外层包装消息
// ============================================================

message MsgBody {
  // ✅ 内容主体；40800-2（LEN）占 1,240,057 行，repeated 覆盖 78,060 行 list 情形
  repeated MsgContent content = 40800;
}

// ============================================================
// 45112 子消息（编辑/已读时间戳）
// ============================================================

message MsgTimestamp {
  int64 timestamp = 50202;  // 🔍 Unix 秒，样本约 2024-11（可能为消息编辑时间）
  int32 f50205    = 50205;  // ❓ 恒为 2
}

// ============================================================
// 45526 子消息（媒体引用信息）
// ============================================================

message MediaRef {
  int64  uid    = 45417;  // 🔍 大整数（毫秒时间戳级别，约 2025-11）
  int32  f45527 = 45527;  // ❓
  Sub    f45528 = 45528;  // ❓ 空 sub-message
  int64  f45529 = 45529;  // ❓
  string md5    = 45530;  // 🔍 32 字节 hex MD5 字符串（100% UTF-8）
  // 可能还有更多字段（45531+），样本中截断
}

// ============================================================
// 45600 子消息（自定义贴图 / 动画表情，三层嵌套）
// ============================================================

message StickerInner {
  int64 sticker_id = 1;  // 🔍 贴图数字 ID（如 1942758）
  bytes md5        = 2;  // 🔍 32 字节 hex MD5
  bytes extra      = 3;  // ❓ 更长的 bytes（可能为更大 hash 或缩略图数据）
}
message StickerL2 { StickerInner data = 1; }
message StickerL1 { StickerL2 data = 1; }
message StickerInfo { StickerL1 data = 1; }

// ============================================================
// 45856 子消息（位置扩展信息）
// ============================================================

message LocationExtra {
  Sub f45857 = 45857;  // ❓ 空
  Sub f45858 = 45858;  // ❓ 空
  Sub f45859 = 45859;  // ❓ 空
  Sub f45860 = 45860;  // ❓ 空
  int32 f45861 = 45861;  // ❓
