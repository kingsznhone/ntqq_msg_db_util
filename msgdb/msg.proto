  bytes  f14       = 14;  // ❓ UTF-8 文本
}

// ============================================================
// 47974 子消息（文件附件 UUID，40011=3）
// ============================================================

message FileIdInfo {
  int32  f1       = 1;   // ❓
  bytes  file_uid = 3;   // 🔍 "MD5_UUID" 格式（MD5hex + "_" + UUID）
  bytes  f4       = 4;   // ❓ binary
}
message FileIdWrapper {
  FileIdInfo info = 1;
}

