// C2C 与 group 共用的 40800 Protobuf 超集。
//
// 重要研究结论：
//   - 外层为 repeated MsgContent；支持文本、媒体、回复、转发、系统和通话；
//   - 45001 是 MsgContent 段级 ID，不等于表级 40001；
//   - 45101 在 C2C/group 样本中按 UTF-8 应用层文本处理；
//   - raw hash、CDN 二进制值保持 bytes；未知字段继续由 wire fallback 保留。
